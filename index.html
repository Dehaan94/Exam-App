<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam Practice Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Exam Practice Hub</h1>
      <p>Choose an exam set, answer each question, and review explanations as you practice.</p>
    </header>

    <main>
      <section class="controls controls--top">
        <label class="select-wrap" for="examSelect">
          <span>Practice Exam</span>
          <select id="examSelect"></select>
        </label>
        <button id="restartQuiz">Restart</button>
      </section>

      <section class="status-panel">
        <div class="status-chip">
          <span>Progress</span>
          <strong id="questionCount">0 / 0</strong>
        </div>
        <div class="status-chip">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="status-chip timer-chip">
          <div class="timer-label">
            <span class="timer-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="8"></circle>
                <path d="M12 8v4l3 2"></path>
                <path d="M12 4V2"></path>
                <path d="M12 22v-2"></path>
                <path d="M4.93 4.93l-1.41-1.41"></path>
                <path d="M20.48 20.48l-1.41-1.41"></path>
              </svg>
            </span>
            <span>Timer</span>
          </div>
          <strong id="timerDisplay">00:00</strong>
          <button id="startTimer" class="timer-button">Start</button>
        </div>
      </section>

      <div class="progress-track" aria-hidden="true">
        <div id="progressFill" class="progress-fill"></div>
      </div>

      <section class="question-card">
        <div id="questionText" class="question-text">Loading questions...</div>
        <div id="choiceList" class="choice-list"></div>
      </section>

      <section class="controls">
        <button id="checkAnswer" class="primary">Show Answer</button>
        <button id="nextQuestion">Next Question</button>
      </section>

      <section id="feedback" class="feedback hidden" aria-live="polite">
        <div id="feedbackText" class="feedback-text"></div>
        <div id="explanation" class="explanation"></div>
      </section>

      <section id="summary" class="summary-card hidden" aria-live="polite"></section>
    </main>

    <footer>
      <p>Ready for practice and review.</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
